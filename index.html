<title>よんで かいて 漢検</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#fbf7ef; --card:#fff; --ink:#2b2a28; --sub:#7a7368; --line:#e6ddcd;
  --accent:#d9692a; --accent2:#2f7f99; --ok:#3f9d6a; --ng:#d9534f; --cur:#fff1d6; --curline:#efb05a;
  --tint-accent:#fff4e8; --tint-r:#eaf4f8; --tint-w:#e9f6ee; --tint-ng:#fcecea; --target:#ffe08a; --paper:#fff; --paper-grid:#e8e8e8; --ink-on-paper:#2b2a28;
  --overlay:rgba(40,30,20,.5); --toast-fg:#fff; --stroke-done:#8b8378; --stroke-cur:#d9532a;
  --font-text:"YuKyokasho","游教科書体","UD デジタル 教科書体 N-R","Hiragino Mincho ProN","Noto Serif JP",serif;
  --font-ui:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#1e1b17; --card:#2a2621; --ink:#f1eadf; --sub:#a99f90; --line:#3e3730; --cur:#46351a; --curline:#c98a3a;
  --tint-accent:#3a2a1c; --tint-r:#1f3038; --tint-w:#1f3328; --tint-ng:#3c2320; --target:#8a6a1a; --overlay:rgba(0,0,0,.65); --toast-fg:#1e1b17; --stroke-done:#6e665c; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#1e1b17; --card:#2a2621; --ink:#f1eadf; --sub:#a99f90; --line:#3e3730; --cur:#46351a; --curline:#c98a3a;
  --tint-accent:#3a2a1c; --tint-r:#1f3038; --tint-w:#1f3328; --tint-ng:#3c2320; --target:#8a6a1a; --overlay:rgba(0,0,0,.65); --toast-fg:#1e1b17; --stroke-done:#6e665c; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
.hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px}
.xp{flex:1;min-width:150px;font-size:12px;color:var(--sub)}
.xpbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:3px}
.xpbar>div{height:100%;background:linear-gradient(90deg,var(--accent),#f0a86a);transition:width .4s}
.levels{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:5px 11px;font-weight:700;font-size:14px;color:var(--sub)}
.lv small{display:block;font-weight:500;font-size:10px}
.lv.on{border-color:var(--accent);color:var(--accent);background:var(--tint-accent)}
.lv.locked{opacity:.45}
nav{display:flex;gap:2px;padding:8px 12px 0;max-width:900px;margin:0 auto}
nav button{flex:1;border:0;background:transparent;padding:9px 2px;border-radius:12px 12px 0 0;font-size:13px;font-weight:700;color:var(--sub)}
nav button.on{background:var(--card);color:var(--accent);box-shadow:0 -2px 0 var(--accent) inset}
main{max-width:900px;margin:0 auto;padding:14px 16px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:12px 0 6px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:15px}
.btn.sec{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.big{padding:14px 22px;font-size:18px;border-radius:16px}
.btn:disabled{opacity:.4}
.chip{display:inline-block;background:var(--cur);border:1px solid var(--curline);border-radius:8px;padding:2px 8px;font-size:13px;margin:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.tile b{display:block;font-size:15px}
.tile small{color:var(--sub);font-size:12px}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 12px}
.stat div{text-align:center;min-width:70px}
.stat .n{font-size:26px;font-weight:800;line-height:1.1}
.stat .l{font-size:11px;color:var(--sub)}
.prog{height:9px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.prog .w{background:var(--ok);height:100%}.prog .r{background:var(--accent2);height:100%}
/* question */
.q{font-family:var(--font-text);font-size:22px;line-height:2;}
.q .sent{background:var(--bg);border-radius:12px;padding:10px 14px;margin:8px 0}
.q .target{background:var(--target);border-radius:4px;padding:0 2px}
.q .blank{display:inline-block;min-width:1.8em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent);font-size:.7em;vertical-align:bottom;padding:0 4px}
ruby rt{font-size:.45em;color:var(--sub);font-family:var(--font-ui);letter-spacing:0;opacity:0}
ruby.show rt,ruby.fur rt,rt.on{opacity:1}
rt.on{font-size:.5em;color:var(--sub);font-family:var(--font-ui);letter-spacing:0}
.kb{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px;direction:rtl}
.kb button{direction:ltr;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 0;font-size:18px;font-family:var(--font-text);min-height:40px}
.kb button.fn{background:var(--tint-accent);font-family:var(--font-ui);font-size:13px;font-weight:700}
.kb button:active{background:var(--cur)}
.kb button.sp{visibility:hidden}
.ansbox{font-family:var(--font-text);font-size:28px;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--card);letter-spacing:.05em}
.ansbox.ok{border-color:var(--ok)}.ansbox.ng{border-color:var(--ng)}
@media(max-width:420px){.kb button{font-size:16px;padding:6px 0;min-height:36px}}
.big{font-family:var(--font-text);font-size:64px;text-align:center;line-height:1.3}
.choices{display:grid;gap:8px;margin-top:12px;grid-template-columns:1fr 1fr}
.choices.one{grid-template-columns:1fr}
.choice{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:21px;font-family:var(--font-text);text-align:center;min-height:52px}
.choice small{display:block;font-family:var(--font-ui);font-size:12px;color:var(--sub)}
.choice.ok{border-color:var(--ok);background:var(--tint-w)}.choice.ng{border-color:var(--ng);background:var(--tint-ng)}
.ans-in{font-family:var(--font-text);font-size:24px;width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink)}
.ans-in.ok{border-color:var(--ok)}.ans-in.ng{border-color:var(--ng)}
.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--tint-w)}.fb.ng{background:var(--tint-ng)}
.insight{margin-top:8px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.9}
.insight .w{font-family:var(--font-text);font-size:22px}
.insight .k{display:inline-block;font-family:var(--font-text);font-size:20px;margin-right:4px}
.insight .row2{margin-top:4px}
.insight .tag{margin-right:4px}
.canvaswrap{position:relative;width:min(100%,340px);aspect-ratio:1;margin:8px auto;border:2px solid var(--line);border-radius:14px;background:var(--paper);touch-action:none;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet,.sheet *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet input,.sheet textarea{-webkit-user-select:text;user-select:text}
.canvaswrap canvas{position:absolute;inset:0;width:100%;height:100%}
.canvaswrap .ans{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-text);color:rgba(217,105,42,.3);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
.canvaswrap.reveal .ans{opacity:1}
.canvaswrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grid-bg{position:absolute;inset:0;background:
 linear-gradient(to right,transparent 49.6%,var(--paper-grid) 49.6%,var(--paper-grid) 50.4%,transparent 50.4%),
 linear-gradient(to bottom,transparent 49.6%,var(--paper-grid) 49.6%,var(--paper-grid) 50.4%,transparent 50.4%);pointer-events:none}
.ksvg{width:100%;height:100%}
.ksvg path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4}
.ksvg path.done{stroke:var(--stroke-done)}
.ksvg path.cur{stroke:var(--stroke-cur);stroke-width:5}
.ksvg path.hid{stroke:none}
.ksvg text{font-size:7px;fill:var(--accent2);font-family:var(--font-ui)}
.kbox{width:min(100%,260px);aspect-ratio:1;margin:0 auto;position:relative;background:var(--paper);border:2px solid var(--line);border-radius:14px;overflow:hidden}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.kcell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:var(--font-text);font-size:24px;background:var(--card);border:2px solid var(--line);border-radius:10px;position:relative}
.kcell.m1{border-color:var(--accent2);background:var(--tint-r)}
.kcell.m2{border-color:var(--ok);background:var(--tint-w)}
.kcell.weak{border-color:var(--ng);background:var(--tint-ng)}
.legend{font-size:12px;color:var(--sub);margin:8px 0}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin:8px 0}
.cal div{aspect-ratio:1;border-radius:8px;background:var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
.cal div.on{background:var(--tint-w);border:2px solid var(--ok);color:var(--ink);font-weight:700}
.cal div.today{outline:2px solid var(--accent);outline-offset:1px}
.cal div b{font-size:14px;line-height:1}
.goal{display:flex;align-items:center;gap:14px}
.ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto;position:relative}
.ring span{background:var(--card);width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;background:var(--card)}
.badge.off{opacity:.35}
.badge b{font-size:18px;margin-right:4px}
.done-banner{background:var(--tint-w);border:2px solid var(--ok);border-radius:14px;padding:12px 14px;font-weight:800;font-size:17px;text-align:center}
.modal{position:fixed;inset:0;background:var(--overlay);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.kinfo{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.kinfo .d{font-size:15px;line-height:1.7;flex:1;min-width:200px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--toast-fg);padding:10px 18px;border-radius:30px;font-weight:700;opacity:0;transition:.3s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.weaklist .w{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 0;font-size:15px;align-items:center}
.weaklist .w .k{font-family:var(--font-text);font-size:20px}
.tag{font-size:11px;background:var(--line);border-radius:6px;padding:1px 6px;color:var(--sub)}
.cert{text-align:center;padding:18px;border:3px double var(--accent);border-radius:16px;background:var(--tint-accent)}
.cert .t{font-size:26px;font-weight:800;letter-spacing:.2em;margin:6px 0}
table.tb{width:100%;font-size:14px;border-collapse:collapse}
table.tb td,table.tb th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center}
table.tb th{color:var(--sub);font-weight:600}
table.tb td:first-child,table.tb th:first-child{text-align:left}
select,input[type=text],textarea,input[type=range]{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card);color:var(--ink)}
textarea{width:100%;min-height:100px;line-height:1.7}
.reader{font-family:var(--font-text);font-size:22px;line-height:2.1;letter-spacing:.04em}
.reader p{margin:0 0 1.1em}
.reader.fur-all ruby rt{opacity:1}
.reader.fur-cur ruby.cur rt{opacity:1}
.kw{cursor:pointer;border-bottom:2px solid transparent;border-radius:3px}
.kw.cur{background:var(--cur);border-bottom-color:var(--curline)}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.story{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.story .t{font-weight:800;font-size:15px;margin-top:4px}
.story .m{font-size:12px;color:var(--sub);margin-top:4px}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
pre{background:var(--bg);padding:10px;border-radius:8px;font-size:12px;white-space:pre-wrap;line-height:1.6}

.picker{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.picker.on{display:flex}
.picker h1{font-size:26px;margin:0 0 6px;font-family:var(--font-kana, var(--font-text));text-align:center}
.picker .who{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.picker button{border:3px solid var(--line);background:var(--card);border-radius:28px;width:min(40vw,200px);aspect-ratio:1;font-size:28px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.picker button span{font-size:64px}
.picker button.ra{border-color:#ffe08a}.picker button.rei{border-color:#f7c6d0}.picker button.ru{border-color:#a9d6f3}
.whochip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:5px 12px;font-weight:800;font-size:14px}

.cover{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.cover.on{display:flex}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ph{position:absolute;inset:0;background:linear-gradient(160deg,#ffe3c2 0%,#fbf7ef 55%,#dff1ea 100%)}
.cover .cv-title{position:relative;z-index:1;text-align:center;padding:14px 26px;border-radius:24px;background:rgba(255,255,255,.82);color:#3a332f;font-family:var(--font-kana, var(--font-text));font-weight:800;font-size:clamp(26px,6vw,44px);letter-spacing:.06em;box-shadow:0 6px 24px rgba(0,0,0,.12);margin-top:auto}
.cover .cv-title small{display:block;font-size:14px;font-weight:600;color:#7a6f68;letter-spacing:.1em;margin-top:4px}
.cover .tap{position:relative;z-index:1;margin:18px 0 calc(40px + env(safe-area-inset-bottom,0px));background:#d9692a;color:#fff;font-weight:800;font-size:20px;padding:14px 32px;border-radius:30px;animation:pulse 1.6s ease-in-out infinite;box-shadow:0 6px 0 rgba(0,0,0,.1)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.mascot{display:flex;gap:10px;align-items:flex-end;margin:4px 0 10px}
.mascot .mimg{width:92px;height:92px;object-fit:cover;flex:0 0 auto;background:#fff;border-radius:28%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.08));transform-origin:50% 90%}
.mascot .memoji{width:92px;height:92px;font-size:66px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transform-origin:50% 90%}
.mascot .bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-family:var(--font-kana, var(--font-text));font-weight:800;font-size:17px;line-height:1.5;flex:1;min-width:0;animation:pop .35s ease-out}
.mascot .bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.mascot .bubble::after{content:"";position:absolute;left:-7px;bottom:19px;border:7px solid transparent;border-right-color:var(--card);border-left:0}
.mascot.sm .mimg,.mascot.sm .memoji{width:64px;height:64px;font-size:44px}
.mascot.sm .bubble{font-size:15px;padding:8px 12px}
/* 動き */
.mv-welcome{animation:float 2.4s ease-in-out infinite}
.mv-happy{animation:bounce .7s ease-out 2}
.mv-cheer{animation:jump .6s ease-in-out 3}
.mv-oops{animation:shake .5s ease-in-out 1}
.mv-sad{animation:droop 1.6s ease-in-out infinite}
.mv-hint{animation:nod 1s ease-in-out 2}
.mv-explain{animation:float 2.4s ease-in-out infinite}
.mv-think{animation:tilt 1.8s ease-in-out infinite}
.mv-write{animation:scribble 1s ease-in-out infinite}
.mv-read{animation:float 2.4s ease-in-out infinite}
.mv-sleep{animation:breathe 2.6s ease-in-out infinite}
.mv-surprise{animation:popin .5s cubic-bezier(.2,1.6,.4,1) 1}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0) scale(.97,1.03)}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-18px) rotate(-6deg)}60%{transform:translateY(-10px) rotate(6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-4deg)}40%{transform:translateX(6px) rotate(4deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes droop{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-5deg) translateY(3px)}}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(8deg) translateY(-3px)}60%{transform:rotate(-3deg)}}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes scribble{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-2px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes popin{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.mascot *{animation:none!important}}

.sndbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:5px 10px;font-size:15px}
</style>

<div class="cover" id="cover" onclick="sndUnlock(); document.getElementById('cover').classList.remove('on'); choosePicker();"><div class="ph"></div><img src="cover.jpg" alt="" onerror="this.remove()"><div class="cv-title">よんで かいて 漢検<small>READ · WRITE · KANKEN</small></div><div class="tap">タップして はじめる</div></div>
<div class="picker" id="picker"><h1>だれが やる？</h1><div class="who"><button class="ra" data-who="ra"><span>⭐</span>RA</button><button class="rei" data-who="rei"><span>🌸</span>REI</button><button class="ru" data-who="ru"><span>🐣</span>RU</button></div></div>
<header>
  <div class="hrow">
    <div class="logo">📖 よんで かいて 漢検</div> <button class="whochip" id="whochip" onclick="choosePicker()"></button> <button class="sndbtn" id="sndbtn" onclick="cycleSound()">🎵</button>
    <div class="xp"><span id="xptext"></span><div class="xpbar"><div id="xpfill" style="width:0%"></div></div></div>
    <div id="streak" class="muted"></div>
  </div>
  <div class="levels" id="levels"></div>
</header>
<nav>
  <button data-tab="home" class="on">🏠 きょう</button>
  <button data-tab="drill">🎯 <ruby>分野別<rt class="on">ぶんやべつ</rt></ruby></button>
  <button data-tab="kanji">🈷 <ruby>漢字表<rt class="on">かんじひょう</rt></ruby></button>
  <button data-tab="test">📝 <ruby>模擬<rt class="on">もぎ</rt></ruby></button>
  <button data-tab="story">📚 よむ</button>
  <button data-tab="parent">👪 <ruby>設定<rt class="on">せってい</rt></ruby></button>

const STEPS = [1,3,7,14,30,60,120];
function srs(id){ return S.srs[id]; }
function answer(id, ok){
  const t = today(); let s = S.srs[id] || (S.srs[id] = {iv:0, due:t, n:0, l:0, e:2.5, h:[]});
  s.n++; s.h = (s.h||[]).concat(ok?1:0).slice(-8);
  if(ok){ const idx = STEPS.findIndex(x => x > s.iv); s.iv = idx < 0 ? Math.round(s.iv*s.e) : STEPS[idx]; s.e = Math.min(3, s.e+0.05); }
  else { s.iv = 0; s.l++; s.e = Math.max(1.3, s.e-0.2); }
  s.due = addDays(t, s.iv); s.last = t; S.daily[t] = (S.daily[t]||0) + (ok?1:0); S.dailyAll[t] = (S.dailyAll[t]||0) + 1; save();
}
function isWeak(id){ const s = S.srs[id]; if(!s) return false; const h = s.h||[]; const recentNg = h.slice(-4).filter(x=>!x).length; return s.l >= 2 || recentNg >= 2; }

/* ======================= 出題アイテム生成 ======================= */
const cache = {};
function itemsFor(g){
  if(cache[g]) return cache[g];
  const lv = LEVELS.find(l => l.grade===g); const items = [];
  const ks = KS[g]||[];
  const ws = WORDS.filter(w => w.g===g && w.p >= 1);
  const wordsByK = {}; ws.forEach(w => [...w.w].filter(isHan).forEach(ch => (wordsByK[ch] = wordsByK[ch]||[]).push(w)));
  ks.forEach(k => {
    const lst = (wordsByK[k]||[]).filter(w => KANJI[k].g === w.g).sort((a,b)=> (SENTS[b.w]?1:0)-(SENTS[a.w]?1:0) || b.p-a.p).slice(0,5);
    lst.forEach(w => { items.push({id:'yomi|'+w.w, type:'yomi', key:w.w, k}); if(!w.uk) items.push({id:'kaki|'+w.w, type:'kaki', key:w.w, k}); });
    if(STROKES[k] && STROKES[k].length >= 2) items.push({id:'hitsu|'+k, type:'hitsu', key:k, k});
    items.push({id:'kaku|'+k, type:'kaku', key:k, k});
    if(g >= 3 && KANJI[k].rad) items.push({id:'bushu|'+k, type:'bushu', key:k, k});
    if(g >= 3) lst.filter(w => okuriForms(w)).slice(0,1).forEach(w => items.push({id:'okuri|'+w.w, type:'okuri', key:w.w, k}));
    if(g >= 3) lst.filter(w => onkunOf(w)).slice(0,1).forEach(w => items.push({id:'onkun|'+w.w, type:'onkun', key:w.w, k}));
  });
  const gradeOfPair = (a,b) => Math.max(wordGrade(a), wordGrade(b));
  const inLevel = pg => (g===3 ? pg <= 3 : g===7 ? pg >= 7 : pg === g) || (TYPES_MIN_FIRST(g) && pg <= g);
  if(g >= 3) DOON.forEach((set,si) => { const pg = Math.max(...set[1].map(x=>wordGrade(x[0]))); if(pg <= 7 && (g===3 ? pg<=3 : g===7 ? pg===7 : pg===g)) set[1].forEach((x,wi) => items.push({id:'doon|'+si+'|'+wi, type:'doon', key:si+'|'+wi, k:[...x[0]].find(isHan)})); });
  if(g >= 3) ANTONYMS.forEach((p,i) => { const pg = gradeOfPair(p[0],p[2]); if(pg <= 7 && (g===3 ? pg<=3 : g===7 ? pg===7 : pg===g)) items.push({id:'taigi|'+i, type:'taigi', key:i, k:[...p[0]].find(isHan)}); });
  if(g >= 5) SYNONYMS.forEach((p,i) => { const pg = gradeOfPair(p[0],p[2]); if(pg <= 7 && (g===5 ? pg<=5 : g===7 ? pg===7 : pg===g)) items.push({id:'ruigi|'+i, type:'ruigi', key:i, k:[...p[0]].find(isHan)}); });
  if(g >= 4) KOSEI.forEach((p,i) => { const pg = wordGrade(p[0]); if(pg <= 7 && (g===4 ? pg<=4 : g===7 ? pg===7 : pg===g)) items.push({id:'kosei|'+i, type:'kosei', key:i, k:[...p[0]].find(isHan)}); });
  if(g >= 6) YOJI.forEach((p,i) => { const pg = wordGrade(p[0]); if(pg <= 7 && (g===6 ? pg<=6 : pg===7)) items.push({id:'yoji|'+i, type:'yoji', key:i, k:[...p[0]].find(isHan)}); });
  return cache[g] = items;
}
function TYPES_MIN_FIRST(){ return false; }
function spreadItems(arr, dist=2){ const out=[], rest=arr.slice(); while(rest.length){ let idx = rest.findIndex(it => !out.slice(-dist).some(o => o.k===it.k || o.key===it.key)); if(idx<0) idx=0; out.push(rest.splice(idx,1)[0]); } return out; }
/* 新しい問題の順番: 漢字ごとに「読み2語・書き2語・筆順・画数・部首・送り仮名・音訓・同音」をひとまとまりにして、使用頻度の高い漢字から。
   残りの語は、全漢字を一巡したあとの第2周で出す。対義語などの語彙問題は 8問に1問の割合で差しこむ。 */
const orderCache = {};
function newOrder(g){
  if(orderCache[g]) return orderCache[g];
  const items = itemsFor(g); const byK = {}; const vocab = [];
  items.forEach(i => { if(['taigi','ruigi','kosei','yoji'].includes(i.type)) vocab.push(i); else (byK[i.k] = byK[i.k]||[]).push(i); });
  const bundles = [], pass2 = [];
  (KS[g]||[]).forEach(k => { const its = byK[k]||[]; const words = [...new Set(its.filter(i=>i.type==='yomi').map(i=>i.key))];
    const first = words.slice(0,2), rest = words.slice(2); const b = [];
    first.forEach(w => its.filter(i=>(i.type==='yomi'||i.type==='kaki') && i.key===w).forEach(i=>b.push(i)));
    ['hitsu','kaku','bushu','okuri','onkun','doon'].forEach(t => its.filter(i=>i.type===t).forEach(i=>b.push(i)));
    if(b.length) bundles.push(b);
    rest.forEach(w => its.filter(i=>(i.type==='yomi'||i.type==='kaki') && i.key===w).forEach(i=>pass2.push(i)));
  });
  // 3つの漢字のまとまりを交互に出す（同じ字・同じ語が続かないように）
  const pass1 = [];
  for(let i=0;i<bundles.length;i+=3){ const grp = bundles.slice(i,i+3).map(b=>b.slice()); let any=true; while(any){ any=false; grp.forEach(b => { if(b.length){ pass1.push(b.shift()); any=true; } }); } }
  const out = []; let vi = 0; const seq = pass1.concat(spreadItems(pass2));
  seq.forEach((i, n) => { out.push(i); if(n % 8 === 7 && vi < vocab.length) out.push(vocab[vi++]); });
  while(vi < vocab.length) out.push(vocab[vi++]);
  return orderCache[g] = out;
}
function wordGrade(w){ let g=0; for(const ch of w){ if(ch==='々') continue; if(isHan(ch)){ const e=KANJI[ch]; if(!e) return 99; g=Math.max(g,e.g);} } return g; }
function kata2hira(s){ return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60)); }
function norm(s){ return kata2hira((s||'').trim()).replace(/[\s　]/g,''); }
/* 送り仮名の候補 */
function okuriForms(w){
  const hs = [...w.w].filter(isHan); if(hs.length!==1) return null;
  const k = hs[0]; const kun = KANJI[k].kun.find(r => r.includes('-') && r.replace('-','')===w.r && w.w === k + r.split('-')[1]);
  if(!kun) return null;
  const [stem, ok] = kun.split('-'); const full = stem+ok;
  const forms = new Set([k+ok]);
  if(ok.length>1) forms.add(k+ok.slice(1));
  forms.add(k+full.slice(Math.max(0,stem.length-1)));
  if(ok.length>2) forms.add(k+ok.slice(2));

function allStories(){ return STORIES.concat(S.custom||[]); }
function tokenize(text){ return text.split(/\n\s*\n/).map(par => { const toks=[]; let last=0; RUBY.lastIndex=0; let m; while((m=RUBY.exec(par))){ if(m.index>last) toks.push({t:'s',s:par.slice(last,m.index)}); toks.push({t:'r',k:m[1],r:m[2]}); last=RUBY.lastIndex; } if(last<par.length) toks.push({t:'s',s:par.slice(last)}); return toks; }); }
function renderStoryText(text, g){ return tokenize(text).map(toks => '<p>'+toks.map(t => { if(t.t==='s') return esc(t.s).replace(/\n/g,'<br>'); const wg=wordGrade(t.k); if(wg>g) return esc(t.r); const cur=[...t.k].some(ch=>KANJI[ch]&&KANJI[ch].g===g); return '<ruby class="kw'+(cur?' cur':'')+'" data-r="'+esc(t.r)+'">'+esc(t.k)+'<rt>'+esc(t.r)+'</rt></ruby>'; }).join('')+'</p>').join(''); }
function viewStories(){ const lv=level(); return `<div class="card"><h2>物語をよむ（${lv.name}の漢字で）</h2><p class="muted">読む力の練習用です。${lv.name}までの漢字だけが漢字で表示され、上の漢字はひらがなになります。言葉をタップすると読みが出ます。</p></div><div class="stories">${allStories().map(s=>`<button class="story" data-open="${s.id}"><div style="font-size:30px">${s.emoji||'📘'}</div><div class="t">${esc(s.title)}</div><div class="m">${s.kind||''}・${LEVELS.find(l=>l.id===s.level)?.name||''}むけ</div></button>`).join('')}</div>`; }

/* ======================= セッション ======================= */
let SES = null;
function buildSession(mode, type){
  const g = level().grade; const t = today();
  let pool = [];
  if(mode==='weak'){ pool = weakItems().slice(0,20); }
  else {
    let due = [], weak = [], fresh = [];
    LEVELS.filter(l=>!l.locked && l.grade<=g).forEach(l => itemsFor(l.grade).forEach(i => { if(type && i.type!==type) return; if(isDue(i.id)) due.push(i); else if(isWeak(i.id)) weak.push(i); }));
    due.sort((a,b)=>S.srs[a.id].due.localeCompare(S.srs[b.id].due));
    const newLeft = type ? 10 : Math.max(0, S.newPerDay - (S.introduced[t]||0));
    // 新規: この級の未着手。漢字の使用頻度順（KS は頻度順）に、分野を混ぜながら
    fresh = newOrder(g).filter(i => !S.srs[i.id] && (!type || i.type===type)).slice(0, newLeft);
    pool = type ? due.slice(0,6).concat(weak.slice(0,2), fresh).slice(0,10) : due.slice(0,25).concat(weak.slice(0,5), fresh);
  }
  if(!pool.length && mode==='today'){ pool = newOrder(g).filter(i => !S.srs[i.id]).slice(0, 10); }  // きょうの分が終わっていても、ゴールまで追加で出す
  if(!pool.length){ toast(mode==='weak'?'にがてな もんだいは ありません':'この きゅうの もんだいは ぜんぶ やりました'); return null; }
  pool = spreadItems(pool);
  SES = {mode, type, queue: pool.map(i => ({item:i, need:1, wrong:0})), i:0, done:0, total:pool.length, correct:0, startedNew: pool.filter(i=>!S.srs[i.id]).length, results:[], lastId:null};
  return SES;
}
function startSession(mode, type){ if(!buildSession(mode, type)) return; bgm('play'); nextQ(); }
function nextQ(){
  if(!SES.queue.length){ return endSession(); }
  if(SES.queue.length > 1 && SES.queue[0].item.id === SES.lastId){ const x = SES.queue.shift(); SES.queue.splice(Math.min(2, SES.queue.length), 0, x); }
  else if(SES.queue.length > 1 && SES.lastK && SES.queue[0].item.k === SES.lastK){ const j = SES.queue.findIndex(q => q.item.k !== SES.lastK); if(j > 0){ const x = SES.queue.splice(j,1)[0]; SES.queue.unshift(x); } }

/* 模擬テスト */
let TEST = null;
function startTest(){
  const lv = level(), g = lv.grade; const plan = TEST_PLAN[g]||TEST_PLAN[7]; const items = itemsFor(g); const qs = [];
  Object.keys(plan).forEach(t => { const its = items.filter(i=>i.type===t); qs.push(...pick(its, plan[t])); });
  if(qs.length < 10){ toast('この級の問題が足りません'); return; }
  TEST = {qs: shuffle(qs), i:0, results:[], start: Date.now()}; bgm('play');
  nextTestQ();
}
function nextTestQ(){
  if(TEST.i >= TEST.qs.length) return endTest();
  const q = buildQ(TEST.qs[TEST.i], level().grade); if(!q){ TEST.i++; return nextTestQ(); }
  TEST.q = q; showQ(q, TEST.i+1, TEST.qs.length, 'もぎテスト');
}
function endTest(){
  const lv = level(); const n = TEST.results.length, c = TEST.results.filter(r=>r.ok).length; const score = Math.round(c/n*100);
  const byType = {}; TEST.results.forEach(r => { const b = byType[r.item.type] = byType[r.item.type]||{n:0,c:0}; b.n++; if(r.ok) b.c++; });
  const weak = Object.keys(byType).filter(t => byType[t].c/byType[t].n < 0.6).map(t=>plain(TYPES[t].name)).join('・');
  const mins = Math.round((Date.now()-TEST.start)/60000);
  S.tests.push({date:today(), level:lv.id, score, weak}); S.tests = S.tests.slice(-50); addXP(c*3); touchStreak(); save(); render(); bgm('home'); sfx(score>=lv.pass?'goal':'end');
  openModal(mascot(score>=lv.pass?'cheer':'think', score>=lv.pass?'ごうかくライン とっぱ！ すごい！':'あと すこし！ にがてを つぶそう') + `<h2>${lv.name} 模擬テスト 結果</h2><div class="big">${score}%</div><p style="text-align:center;font-size:18px;font-weight:700">${score>=lv.pass?'🎉 合格ラインを超えました':'合格ラインまで あと '+(lv.pass-score)+'%'}</p><p class="muted" style="text-align:center">${c} / ${n} 問正解・${mins}分</p>
   <table class="tb"><tr><th>分野</th><th>正解</th><th>正答率</th></tr>${Object.keys(byType).map(t=>`<tr><td>${rb(TYPES[t].name)}</td><td>${byType[t].c}/${byType[t].n}</td><td ${byType[t].c/byType[t].n<0.6?'style="color:var(--ng)"':''}>${Math.round(byType[t].c/byType[t].n*100)}%</td></tr>`).join('')}</table>
   <p class="muted">まちがえた問題は反復のキューに入りました。「きょうの学習」で出ます。</p>

function judgeInput(){ const el = $('#ansin') || $('#ansbox'); if(!el || el.dataset.done) return; const v = norm(el.id==='ansin' ? el.value : KB.text); if(!v) return; const ok = v===norm(CUR.answer) || (CUR.accept||[]).some(a => norm(a)===v); el.classList.add(ok?'ok':'ng'); el.dataset.done='1'; if(el.id==='ansin') el.disabled=true; finish(ok, ok?'':'こたえは「'+CUR.answer+'」'); }
/* 50音キーボード（IME を使わずひらがなだけ入力） */
const KB = {text:''};
const KANA_COLS = ['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や　ゆ　よ','らりるれろ','わ　を　ん'];
const DAKU = {か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ',う:'ゔ'};
const HANDAKU = {は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ'};
const SMALL = {あ:'ぁ',い:'ぃ',う:'ぅ',え:'ぇ',お:'ぉ',つ:'っ',や:'ゃ',ゆ:'ゅ',よ:'ょ',わ:'ゎ'};
function kanaKeyboard(){
  KB.text = '';
  let html = '<div class="kb">';
  // 右から あ段…（direction:rtl で右端が「あ」列）。列ごとに縦に並べるため行優先で出力
  html += `<button class="fn" onclick="kbFn('bs')">⌫</button>` + KANA_COLS.map(c=>`<button onclick="kbKey('${c[0]}')">${c[0]}</button>`).join('');
  html += `<button class="fn" onclick="kbFn('daku')">゛</button>` + KANA_COLS.map(c=>c[1]==='　'?'<button class="sp"></button>':`<button onclick="kbKey('${c[1]}')">${c[1]}</button>`).join('');
  html += `<button class="fn" onclick="kbFn('handaku')">゜</button>` + KANA_COLS.map(c=>`<button onclick="kbKey('${c[2]}')">${c[2]}</button>`).join('');
  html += `<button class="fn" onclick="kbFn('small')">小</button>` + KANA_COLS.map(c=>c[3]==='　'?'<button class="sp"></button>':`<button onclick="kbKey('${c[3]}')">${c[3]}</button>`).join('');
  html += `<button class="fn" onclick="kbKey('ー')">ー</button>` + KANA_COLS.map(c=>`<button onclick="kbKey('${c[4]}')">${c[4]}</button>`).join('');
  return html + '</div>';
}
function kbRender(){ const b=$('#ansbox'); if(b) b.innerHTML = esc(KB.text)||'&nbsp;'; }
function kbKey(ch){ const b=$('#ansbox'); if(!b || b.dataset.done) return; if(KB.text.length<16) KB.text += ch; kbRender(); }
function kbFn(f){ const b=$('#ansbox'); if(!b || b.dataset.done) return; const t = KB.text; const last = t.slice(-1);
  if(f==='bs') KB.text = t.slice(0,-1);
  else if(f==='daku'){ const rev = Object.keys(DAKU).find(k=>DAKU[k]===last); if(DAKU[last]) KB.text = t.slice(0,-1)+DAKU[last]; else if(rev) KB.text = t.slice(0,-1)+rev; }
  else if(f==='handaku'){ const rev = Object.keys(HANDAKU).find(k=>HANDAKU[k]===last); const base = Object.keys(DAKU).find(k=>DAKU[k]===last)||last; if(HANDAKU[base]) KB.text = t.slice(0,-1)+HANDAKU[base]; else if(rev) KB.text = t.slice(0,-1)+rev; }
  else if(f==='small'){ const rev = Object.keys(SMALL).find(k=>SMALL[k]===last); if(SMALL[last]) KB.text = t.slice(0,-1)+SMALL[last]; else if(rev) KB.text = t.slice(0,-1)+rev; }
  kbRender(); }
function judgeChoice(btn){ const v = btn.dataset.v; const ok = v===CUR.answer; document.querySelectorAll('.choice').forEach(b => { b.disabled=true; if(b.dataset.v===CUR.answer) b.classList.add('ok'); }); if(!ok) btn.classList.add('ng'); finish(ok, ok?'':'こたえは「'+(CUR.label?CUR.label(CUR.answer):CUR.answer)+'」'); }

function finish(ok, msg){

  const ins = q.insight ? (mascot('explain', null, 'sm') + q.insight()) : '';

  const mexpr = ok ? ((SES && SES.streakOk>=3 && SES.streakOk%3===0) ? 'cheer' : 'happy') : (wasWrong || isWeak(q.item.id) ? 'sad' : 'oops');

  const fb = $('#fb'); if(fb) fb.innerHTML = mascot(mexpr, null, 'sm') + `<div class="fb ${ok?'ok':'ng'}">${ok?'⭕ せいかい！':'❌ '+esc(msg)}　<span>${rb(q.explain)}</span>${q.item.k&&STROKES[q.item.k]?` <button class="btn ghost sm" onclick="showKanjiCard('${q.item.k}')">かんじカード</button>`:''}</div>${ins}<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="nextbtn" onclick="proceed()">つぎへ →</button></div>`;

function proceed(){

    // 残りが少ないと同じ問題がすぐ戻ってくるので、新しい問題を補充して間隔をあける

/* 手書き */
function canvasHTML(ans){ const n=[...ans].length; return `<div class="canvaswrap" id="cw"><div class="grid-bg"></div><canvas id="cv"></canvas><div class="ans" style="font-size:${Math.min(200, 280/Math.max(1,n))}px">${esc(ans)}</div></div>`; }
let CV=null;
function setupCanvas(){ const c=$('#cv'); if(!c) return; const wrap=$('#cw'); const dpr=window.devicePixelRatio||1; const w=wrap.clientWidth,h=wrap.clientHeight; c.width=w*dpr; c.height=h*dpr; const ctx=c.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=8; ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink-on-paper').trim()||'#2b2a28'; CV={c,ctx,drawing:false};
  const pos=e=>{ const r=c.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  c.onpointerdown=e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); CV.drawing=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); };
  c.onpointermove=e=>{ if(!CV.drawing) return; e.preventDefault(); const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); };
  c.onpointerup=c.onpointercancel=c.onpointerleave=()=>{ CV.drawing=false; };
  ['touchstart','touchmove','touchend'].forEach(ev => c.addEventListener(ev, e => e.preventDefault(), {passive:false}));
  wrap.addEventListener('contextmenu', e => e.preventDefault()); }
function clearCanvas(){ if(CV) CV.ctx.clearRect(0,0,CV.c.width,CV.c.height); }
